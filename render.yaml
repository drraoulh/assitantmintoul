services:
  # Legacy Expo web (jury) — https://smartmboa-tour.onrender.com
  # Kept during Next.js validation. Do not remove until Web is validated.
  - type: web
    name: smartmboa-tour
    runtime: static
    plan: free
    branch: master
    buildCommand: "echo 'Using committed mobile/dist'"
    staticPublishPath: mobile/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Next.js tourism web — https://smartmboa-web.onrender.com
  # (URL confirmed by Render after first Blueprint sync; name → hostname).
  - type: web
    name: smartmboa-web
    runtime: node
    plan: free
    branch: master
    rootDir: frontend-web
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22.14.0"
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://cameroon-ai-tour-guide-api.onrender.com

  # API — https://cameroon-ai-tour-guide-api.onrender.com
  - type: web
    name: cameroon-ai-tour-guide-api
    runtime: docker
    plan: free
    branch: master
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_MODEL_ID
        value: Qwen/Qwen3.5-9B:fastest
      - key: HF_TIMEOUT_SECONDS
        value: "60"
      - key: LLM_MAX_TOKENS
        value: "320"
      - key: LLM_VOICE_MAX_TOKENS
        value: "140"
      - key: RAG_ENABLED
        value: "true"
      - key: RAG_TOP_K
        value: "4"
      - key: WEB_SEARCH_ENABLED
        value: "true"
      - key: WEB_SEARCH_MAX_RESULTS
        value: "3"
      - key: WEB_SEARCH_TIMEOUT_SECONDS
        value: "2.5"
      - key: VOICE_WEB_SEARCH_TIMEOUT_SECONDS
        value: "1.5"
      - key: LLM_HISTORY_MESSAGES
        value: "6"
      - key: LLM_VOICE_HISTORY_MESSAGES
        value: "3"
      - key: DATABASE_ENABLED
        value: "true"
      - key: HUGGINGFACE_HUB_TOKEN
        sync: false
      - key: AGENT_ORCHESTRATOR_ENABLED
        value: "true"
      - key: AGENT_ORCHESTRATOR_USE_LLM
        value: "true"
      - key: VOICE_LLM_STREAMING_ENABLED
        value: "true"
      - key: VOICE_TTS_QUEUE_MAXSIZE
        value: "4"
      - key: GROUNDING_ENFORCEMENT_ENABLED
        value: "true"
      - key: KNOWLEDGE_GEOGRAPHY_ENABLED
        value: "true"
      - key: WEB_KNOWLEDGE_FALLBACK_ENABLED
        value: "false"
      # Explicit browser origins (Expo static + Next.js + local). No secrets.
      # After first deploy, confirm smartmboa-web hostname in Render dashboard.
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://127.0.0.1:3000,https://smartmboa-tour.onrender.com,https://smartmboa-web.onrender.com"
